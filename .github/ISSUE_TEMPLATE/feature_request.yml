name: Feature request
description: An idea for something revue could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or the problem, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could revue help?
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today, or tried instead
