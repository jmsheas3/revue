# cargo-about's settings for THIRD_PARTY_LICENSES_RUST, the license notices of the Rust crates compiled into the
# release binaries (.github/scripts/licenses.sh renders about.hbs with them). A crate whose license expression these
# can't satisfy fails CI, so a new dependency's license is looked at before it ships.

# In order of preference: a crate offered under several licenses is listed under the first of them here.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

# The release targets, all at once: one file covers every binary, so it can name a crate a given one doesn't hold.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Only what is compiled into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
