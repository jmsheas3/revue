# Checks Cargo.lock against the RustSec advisory database every week, so a vulnerability published for a crate revue
# already uses is flagged even when nothing changes. (CI runs the same check on every PR.) GitHub emails the person
# who last changed this schedule when a scheduled run fails.
name: Security audit

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security audit (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch: [main, develop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
      - run: cargo audit
