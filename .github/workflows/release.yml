# Every merge to main: runs all of CI again on the merged commit, builds the release binaries for Linux (x86_64 and
# ARM64, static), macOS (universal) and Windows (x86_64) and smoke-tests each, keeping them with the run. When
# Cargo.toml's version isn't released yet, it also signs and notarizes the macOS binary and installer, installs and
# tests them on an Apple Silicon and an Intel Mac, and publishes everything as the release v<version>, which tags the
# merged commit. Nothing is tagged until every step has passed, so a failed run uses up no version: fix it and rerun.
#
# Run it by hand from main (Actions → Release → Run workflow) for a dry run: everything but publishing, signing
# included, so the secrets can be tested without a release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, sign and notarize, but don't publish
        type: boolean
        default: true

permissions:
  contents: read

# One release run at a time, in order; a run waiting its turn isn't cancelled by a newer merge, only replaced by it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sign: ${{ steps.decide.outputs.sign }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: python3 .github/scripts/version.py release
      - id: decide
        env:
          NEW: ${{ steps.version.outputs.release }}
          TAG: ${{ steps.version.outputs.tag }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF: ${{ github.ref }}
        run: |
          sign=false publish=false
          if [ "$REF" != refs/heads/main ]; then
            echo "::notice title=Release::Not on main, so this only builds."
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = true ]; then
            sign=true
            echo "::notice title=Release::Dry run: building, signing and notarizing $TAG, but not publishing."
          elif [ "$NEW" = true ]; then
            sign=true publish=true
            echo "::notice title=Release::Releasing $TAG."
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-about@0.9.3
      - run: .github/scripts/licenses.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: THIRD_PARTY_LICENSES_RUST
          path: THIRD_PARTY_LICENSES_RUST
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: [plan, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, targets: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-musl }
          - { name: macos-universal, os: macos-latest, targets: aarch64-apple-darwin x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, targets: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      NAME: ${{ matrix.name }}
      TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Release builds start clean, with nothing restored from a cache.
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.targets }}
          cache: 'false'
      - name: Build
        shell: bash
        run: |
          # Windows: link the C runtime in, so revue.exe doesn't need the Visual C++ Redistributable.
          case "$NAME" in windows-*) export RUSTFLAGS="-C target-feature=+crt-static" ;; esac
          for t in $TARGETS; do cargo build --release --locked --target "$t"; done
      - name: Assemble the binary
        shell: bash
        run: |
          mkdir out
          case "$NAME" in
            macos-universal)
              lipo -create -output out/revue target/aarch64-apple-darwin/release/revue target/x86_64-apple-darwin/release/revue
              lipo -info out/revue ;;
            windows-*)
              cp "target/$TARGETS/release/revue.exe" out/ ;;
            linux-*)
              cp "target/$TARGETS/release/revue" out/
              file out/revue
              if readelf -d out/revue | grep -q NEEDED; then
                echo "::error::out/revue needs shared libraries; it should be static"
                readelf -d out/revue
                exit 1
              fi ;;
          esac
      - name: Smoke test
        if: runner.os != 'Windows'
        run: .github/scripts/smoke-test.sh out/revue
      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/smoke-test.ps1 -Binary out/revue.exe
      # The crates' license notices, packaged with the binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: THIRD_PARTY_LICENSES_RUST
      - name: Package
        if: runner.os != 'Windows'
        run: .github/scripts/package.sh "$NAME" out/revue dist
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # As package.sh does: no version in the name, and the files the README links to.
          $base = "revue-$env:NAME"
          New-Item -ItemType Directory -Path "stage/$base/docs", dist | Out-Null
          Copy-Item out/revue.exe, LICENSE, THIRD_PARTY_LICENSES, THIRD_PARTY_LICENSES_RUST, README.md, SECURITY.md -Destination "stage/$base"
          Copy-Item docs/*.md -Destination "stage/$base/docs"
          Compress-Archive -Path "stage/$base" -DestinationPath "dist/$base.zip"
          Get-ChildItem dist
      # The macOS archive here is unsigned; sign-macos makes the signed one that is released.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  sign-macos:
    name: Sign and notarize (macOS)
    needs: [plan, build]
    if: needs.plan.outputs.sign == 'true'
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-macos-universal
          path: unsigned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: THIRD_PARTY_LICENSES_RUST
      - name: Sign, notarize and package
        env:
          MACOS_APP_P12: ${{ secrets.MACOS_APP_P12 }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: .github/scripts/macos-sign.sh unsigned/revue-macos-universal.tar.gz signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos-universal
          path: signed/
          if-no-files-found: error

  verify-macos:
    name: Verify (macOS, ${{ matrix.name }})
    needs: [plan, sign-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Apple Silicon, os: macos-latest, arch: arm64 }
          - { name: Intel, os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-macos-universal
          path: signed
      - name: Install the .pkg and test what it installed
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          [ "$(uname -m)" = "$ARCH" ] || { echo "::error::Expected an $ARCH Mac, got $(uname -m)"; exit 1; }
          pkg=$(ls signed/*.pkg)
          # stapler looks the ticket up with Apple online, so a dropped connection is retried (retry.sh).
          .github/scripts/retry.sh xcrun stapler validate "$pkg"
          spctl --assess --type install --verbose=2 "$pkg"
          sudo installer -pkg "$pkg" -target /
          pkgutil --pkg-info io.github.jmsheas3.revue
          codesign --verify --strict --verbose=2 /usr/local/bin/revue
          .github/scripts/smoke-test.sh /usr/local/bin/revue
          # The .tar.gz holds the very same binary.
          mkdir unpacked
          tar -xzf signed/*.tar.gz -C unpacked
          cmp /usr/local/bin/revue unpacked/*/revue

  publish:
    name: Publish
    needs: [ci, plan, build, sign-macos, verify-macos]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write # create the release and its tag
      pull-requests: read # list the merged PRs for the notes
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the notes list the PRs since the previous release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-linux-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-windows-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-macos-universal
          path: release
      # Also on its own, for the .pkg, which installs only the binary: installing notices under /usr/local/share
      # could take over folders Homebrew owns on Intel Macs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: THIRD_PARTY_LICENSES_RUST
          path: release
      - name: Checksums
        working-directory: release
        run: |
          ls -l
          [ "$(ls | wc -l)" -eq 6 ] || { echo "::error::Expected 6 files to release"; exit 1; }
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: python3 .github/scripts/release-notes.py | tee notes.md
      - name: Publish
        run: .github/scripts/publish.sh release
